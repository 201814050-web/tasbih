<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ডিজিটাল তাসবিহ</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }
        .top-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }
        .mode-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            background-color: #2c3e50;
        }
        .mode-btn.active-33 {
            background-color: #00e676;
            color: #000000;
        }
        .mode-btn.active-100 {
            background-color: #00e676;
            color: #000000;
        }
        .reset-btn {
            background-color: #ff5252;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 20px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .total-box {
            font-size: 18px;
            color: #b0bec5;
            margin-top: 15px;
            text-align: center;
        }
        .total-count {
            color: #ffca28;
            font-weight: bold;
        }
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .target-text {
            font-size: 24px;
            color: #b0bec5;
            margin-bottom: 10px;
        }
        .count-display {
            font-size: 120px;
            font-weight: bold;
            color: #00e676;
            line-height: 1;
        }
        .instruction-text {
            font-size: 16px;
            color: #78909c;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body id="tapArea">

    <div>
        <div class="top-bar">
            <button id="btn33" class="mode-btn active-33" onclick="setTarget(33, event)">৩৩ মোড</button>
            <button id="btn100" class="mode-btn" onclick="setTarget(100, event)">১০০ মোড</button>
            <button class="reset-btn" onclick="resetAll(event)">রিসেট</button>
        </div>
        <div class="total-box">
            সর্বমোট তাসবিহ: <span id="totalCount" class="total-count">০</span>
        </div>
    </div>

    <div class="center-content">
        <div class="target-text">টার্গেট: <span id="targetDisplay">৩৩</span></div>
        <div id="countDisplay" class="count-display">0</div>
    </div>

    <div class="instruction-text">
        স্ক্রিনের যেকোনো জায়গায় টাচ করুন
    </div>

    <script>
        let count = 0;
        let totalCount = 0;
        let target = 33;

        const countDisplay = document.getElementById('countDisplay');
        const totalCountDisplay = document.getElementById('totalCount');
        const targetDisplay = document.getElementById('targetDisplay');
        const btn33 = document.getElementById('btn33');
        const btn100 = document.getElementById('btn100');

        function toBanglaDigit(num) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().split('').map(d => banglaDigits[d] || d).join('');
        }

        function updateDisplay() {
            countDisplay.innerText = count.toString(); // বর্তমান কাউন্ট ইংলিশে দেখাবে
            totalCountDisplay.innerText = toBanglaDigit(totalCount);
            targetDisplay.innerText = toBanglaDigit(target);
        }

        function incrementCount() {
            count++;
            totalCount++;

            // টার্গেট (৩৩ বা ১০০) পূর্ণ হলে ১ সেকেন্ড ভাইব্রেশন হবে এবং বর্তমান কাউন্ট ০ হয়ে যাবে
            if (count === target) {
                if (navigator.vibrate) {
                    navigator.vibrate(1000);
                }
                count = 0; // সাইকেল শেষ হওয়ায় বর্তমান কাউন্ট ০
            }

            updateDisplay();
        }

        // মোড পরিবর্তন বাটন
        function setTarget(newTarget, event) {
            if (event) event.stopPropagation();
            target = newTarget;
            count = 0;
            totalCount = 0;

            if (target === 33) {
                btn33.className = 'mode-btn active-33';
                btn100.className = 'mode-btn';
            } else {
                btn33.className = 'mode-btn';
                btn100.className = 'mode-btn active-100';
            }
            updateDisplay();
        }

        // রিসেট বাটন
        function resetAll(event) {
            if (event) event.stopPropagation();
            count = 0;
            totalCount = 0;
            updateDisplay();
        }

        // স্ক্রিনে ট্যাপ করার ইভেন্ট
        document.body.addEventListener('pointerdown', function(e) {
            if (e.target.tagName === 'BUTTON') return;
            e.preventDefault();
            incrementCount();
        });

        updateDisplay();
    </script>
</body>
</html>
