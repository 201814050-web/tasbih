<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ডিজিটাল তাসবিহ</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            touch-action: manipulation;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background-color: #121212 !important;
            color: #ffffff !important;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ওপরের স্থির বাটন সেকশন */
        .top-controls {
            width: 100%;
            padding: 20px 10px 10px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 999;
            background-color: #121212;
        }

        .btn {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent !important;
        }

        .btn-mode {
            background-color: #2c3e50;
            color: #ffffff;
        }

        .btn-mode.active {
            background-color: #00e676;
            color: #000000;
        }

        .btn-reset {
            background-color: #ff5252;
            color: #ffffff;
        }

        /* ফুল স্ক্রিন ইনস্ট্যান্ট টাচ এরিয়া */
        .main-touch-zone {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent !important;
        }

        .top-info {
            font-size: 26px;
            color: #b0bec5;
            margin-bottom: 10px;
            pointer-events: none;
        }

        .counter-display {
            font-size: 130px;
            font-weight: bold;
            color: #00e676;
            line-height: 1;
            pointer-events: none;
        }

        .instruction {
            font-size: 16px;
            color: #78909c;
            margin-top: 30px;
            pointer-events: none;
        }
    </style>
</head>
<body id="touch-area">

    <!-- ওপরের বাটন -->
    <div class="top-controls" id="controls">
        <button id="btn-33" class="btn btn-mode active" onclick="setTarget(33, event)">৩৩ মোড</button>
        <button id="btn-100" class="btn btn-mode" onclick="setTarget(100, event)">১০০ মোড</button>
        <button class="btn btn-reset" onclick="resetCounter(event)">রিসেট</button>
    </div>

    <!-- ফুল স্ক্রিন টাচ জোন -->
    <div class="main-touch-zone" id="fast-touch-zone">
        <div class="top-info">
            টার্গেট: <span id="target-display">৩৩</span>
        </div>

        <div class="counter-display" id="count-display">
            0
        </div>

        <div class="instruction">
            স্ক্রিনের যেকোনো জায়গায় দ্রুত টাচ করুন
        </div>
    </div>

    <script>
        let count = 0;
        let target = 33;

        const countDisplay = document.getElementById('count-display');
        const targetDisplay = document.getElementById('target-display');
        const fastTouchZone = document.getElementById('fast-touch-zone');
        const btn33 = document.getElementById('btn-33');
        const btn100 = document.getElementById('btn-100');

        function triggerVibration() {
            if ("vibrate" in navigator) {
                navigator.vibrate(1000); // ঠিক ১ সেকেন্ড (১০০০ মিলি-সেকেন্ড) ভাইব্রেশন
            }
        }

        // দ্রুত পর পর ইনস্ট্যান্ট টাচ হ্যান্ডলার
        fastTouchZone.addEventListener('touchstart', function(e) {
            e.preventDefault();

            count++;
            countDisplay.innerText = count;

            if (count >= target) {
                triggerVibration();
                count = 0;
                countDisplay.innerText = count;
            }
        }, { passive: false });

        function setTarget(newTarget, e) {
            e.stopPropagation();
            target = newTarget;
            targetDisplay.innerText = target;
            count = 0;
            countDisplay.innerText = count;

            if (newTarget === 33) {
                btn33.classList.add('active');
                btn100.classList.remove('active');
            } else {
                btn100.classList.add('active');
                btn33.classList.remove('active');
            }
        }

        function resetCounter(e) {
            e.stopPropagation();
            count = 0;
            countDisplay.innerText = count;
        }
    </script>
</body>
</html>
